function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function pick(arr,n){return shuffle(arr).slice(0,Math.min(n,arr.length))}
function reps(goal){
 if(goal==="Strength") return ["4–6 reps","5–8 reps","6–8 reps"][Math.floor(Math.random()*3)];
 if(goal==="Fat Loss"||goal==="Fitness") return ["10–15 reps","12–20 reps","30 sec"][Math.floor(Math.random()*3)];
 return ["8–12 reps","10–12 reps","10–15 reps"][Math.floor(Math.random()*3)];
}
let repdbExercises = null;
let repdbLoading = null;

async function loadRepDB(){
  if(repdbExercises) return repdbExercises;
  if(repdbLoading) return repdbLoading;
  repdbLoading = fetch("https://exercise-dataset.com/exercises.json")
    .then(r=>{ if(!r.ok) throw new Error("RepDB unavailable"); return r.json(); })
    .then(data=>{ repdbExercises = Array.isArray(data) ? data : (Array.isArray(data.exercises) ? data.exercises : []); return repdbExercises; })
    .catch(()=>{ repdbExercises = []; return repdbExercises; });
  return repdbLoading;
}

function norm(s){return String(s||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g," ").trim();}
function exerciseMatchesMuscle(ex, muscle){
  if(muscle === "Full Body") return String(ex.body_part||"").toLowerCase()==="full_body" || (ex.primary_muscles||[]).length>=3;
  const body=norm(ex.body_part);
  const muscles=[...(ex.primary_muscles||[]),...(ex.secondary_muscles||[])].map(norm).join(" ");
  const wanted={Chest:["chest","pector"],Back:["back","latissimus","rhomboid","trapezius"],Shoulders:["shoulder","deltoid"],Arms:["arm","biceps","triceps","brachial"],Legs:["leg","quad","hamstring","glute","calf"],Abs:["ab","core","oblique"]}[muscle]||[];
  return wanted.some(w=>body.includes(w)||muscles.includes(w));
}
function exerciseMatchesEquipment(ex, eq){
  const equipment=norm(ex.equipment);
  const hasEquipment=equipment.length>0;
  if(eq==="No Equipment" || eq==="Bodyweight") return !hasEquipment;
  if(eq==="Dumbbells") return equipment.includes("dumbbell");
  if(eq==="Barbell") return equipment.includes("barbell") || equipment.includes("ez bar") || equipment.includes("trap bar");
  if(eq==="Resistance Bands") return equipment.includes("resistance band") || equipment.includes("loop band") || equipment.includes("band");
  if(eq==="Gym Machines") {
    const machineTerms=["machine","cable","smith","leg press","leg curl","leg extension","hack squat","pec deck","pulldown","row machine","press machine","ab crunch machine","calf raise machine","hip abduction","hip adduction","assisted pull up"];
    return machineTerms.some(term=>equipment.includes(term));
  }
  if(eq==="Mixed Equipment") return true;
  return false;
}
function imageUrl(ex, pose="start"){
  const flat=ex && ex.images && ex.images.flat;
  if(!flat) return "";
  const path=flat[pose] || flat.main || flat.start || flat.peak || "";
  return path ? "https://exercise-dataset.com/"+path.replace(/^\//,"") : "";
}
function fallbackCandidates(ex){
  const flat=ex && ex.images && ex.images.flat;
  if(!flat) return [];
  return [flat.peak,flat.main,flat.start].filter(Boolean).map(x=>"https://exercise-dataset.com/"+x.replace(/^\//,""));
}

async function generate(){
  const goal=document.getElementById("goal").value, time=+document.getElementById("time").value;
  const muscle=document.getElementById("muscle").value, eq=document.getElementById("equipment").value;
  const result=document.getElementById("result"), exercisesEl=document.getElementById("exercises");
  result.classList.remove("hidden");
  document.getElementById("title").textContent=`${muscle} Workout`;
  document.getElementById("summary").innerHTML=`<span class="pill">🎯 ${goal}</span><span class="pill">⏱️ ${time} min</span><span class="pill">💪 ${muscle}</span><span class="pill">🏋️ ${eq}</span>`;
  exercisesEl.innerHTML='<div class="small" style="padding:16px;text-align:center">Building your workout and matching every exercise to its equipment and demonstration image…</div>';

  const catalog=await loadRepDB();
  let candidates=catalog.filter(ex=>exerciseMatchesEquipment(ex,eq) && exerciseMatchesMuscle(ex,muscle) && ex.images && ex.images.flat);
  if(goal==="Build Muscle") candidates.sort((a,b)=>(b.goals||[]).includes("hypertrophy")-(a.goals||[]).includes("hypertrophy"));
  if(goal==="Strength") candidates.sort((a,b)=>(b.goals||[]).includes("strength")-(a.goals||[]).includes("strength"));
  if(goal==="Fat Loss" || goal==="Fitness") candidates.sort((a,b)=>(b.goals||[]).includes("endurance")-(a.goals||[]).includes("endurance"));

  if(!candidates.length){
    exercisesEl.innerHTML='<div class="exercise"><div class="name">Not enough verified exercises</div><div class="exercise-how" style="margin-top:8px">There are not enough exercises in the verified library for this exact combination yet. Try a different muscle group or equipment option. FitForge will never substitute an exercise with the wrong equipment.</div></div>';
    return;
  }

  const countByTime={15:4,20:5,30:7,45:9,60:11};
  // Prefer familiar beginner-friendly exercises when they fit the selected filters.
  // The exercise still must come from the verified RepDB record, so its photo/equipment stay accurate.
  const easyNames=["push up","knee push up","squat","bodyweight squat","lunge","reverse lunge","glute bridge","plank","side plank","crunch","sit up","mountain climber","jumping jack","burpee","calf raise","wall sit","bird dog","dead bug"];
  const easyScore=ex=>{
    const n=norm(ex.name_en);
    const idx=easyNames.findIndex(x=>n.includes(x));
    return idx===-1 ? 0 : easyNames.length-idx+10;
  };
  candidates.sort((a,b)=>easyScore(b)-easyScore(a));
  const count=countByTime[time]||5;
  const easy=candidates.filter(ex=>easyScore(ex)>0);
  const chosen=pick(easy.slice(0, Math.min(easy.length, Math.ceil(count/2))), Math.min(Math.ceil(count/2), easy.length));
  const remaining=candidates.filter(ex=>!chosen.includes(ex));
  chosen.push(...pick(remaining, count-chosen.length));
  const sets=goal==="Strength"?"4 sets":goal==="Fat Loss"?"3 sets":"3 sets";
  document.getElementById("exercises").innerHTML=chosen.map((ex,i)=>{
    const target=reps(goal), rest=goal==="Strength"?"90–120":"45–75";
    const img=imageUrl(ex,"start"); const fallbacks=fallbackCandidates(ex).filter(u=>u!==img);
    const instructions=(ex.instructions_en||[]).slice(0,2).join(" ") || ex.description_en || "Use controlled movement and good posture.";
    const equipmentLabel=ex.equipment ? ex.equipment.replace(/_/g," ").replace(/\b\w/g,m=>m.toUpperCase()) : "No equipment";
    const fallbackAttr=JSON.stringify(fallbacks).replace(/"/g,'&quot;');
    return `<div class="exercise"><div class="top"><div><div class="name">${i+1}. ${ex.name_en}</div><div class="tag">${sets}</div></div><div class="tag">${target}</div></div><div class="exercise-media"><img src="${img}" alt="How to do ${ex.name_en}" data-fallbacks="${fallbackAttr}" onerror="swapExerciseImage(this)"><div class="exercise-how"><b>How to do it</b>${instructions}<div style="margin-top:7px;color:#fff;font-size:11px">Equipment: ${equipmentLabel}</div></div></div><div class="details"><div class="detail"><b>${sets.split(" ")[0]}</b><span>Sets</span></div><div class="detail"><b>${target}</b><span>Target</span></div><div class="detail"><b>${rest}s</b><span>Rest</span></div></div></div>`;
  }).join("");
  window.scrollTo({top:document.getElementById("result").offsetTop-10,behavior:"smooth"});
}

function swapExerciseImage(img){
  let list=[]; try{list=JSON.parse(img.dataset.fallbacks||"[]")}catch(e){}
  const next=list.shift();
  img.dataset.fallbacks=JSON.stringify(list);
  if(next){img.src=next;return;}
  img.onerror=null;
  img.style.display="none";
}

async function shareWorkout(){
  const result=document.getElementById("result");
  if(result.classList.contains("hidden")) return;
  const cards=[...document.querySelectorAll("#exercises .exercise")];
  const goal=document.getElementById("goal").value;
  const time=document.getElementById("time").value;
  const muscle=document.getElementById("muscle").value;
  const equipment=document.getElementById("equipment").value;
  const items=cards.map((card,i)=>{
    const name=card.querySelector(".name")?.textContent?.replace(/^\d+\.\s*/,"")||`Exercise ${i+1}`;
    const details=[...card.querySelectorAll(".detail")].map(x=>x.innerText.replace(/\n/g," "));
    return {name,details};
  });
  const canvas=document.createElement("canvas");
  canvas.width=1080; canvas.height=1920;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#0b0d10"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ffffff"; ctx.font="800 64px system-ui"; ctx.fillText("YOUR WORKOUT",70,110);
  ctx.fillStyle="#aeb6c2"; ctx.font="400 30px system-ui"; ctx.fillText(`${goal} • ${time} min • ${muscle}`,70,160);
  ctx.fillText(`Equipment: ${equipment}`,70,205);
  let y=285;
  items.forEach((item,i)=>{
    if(y>1750) return;
    ctx.fillStyle="#14181e"; ctx.fillRect(55,y-50,970,150);
    ctx.fillStyle="#ffffff"; ctx.font="800 34px system-ui"; ctx.fillText(`${i+1}. ${item.name}`,85,y);
    ctx.fillStyle="#cbd2dc"; ctx.font="500 25px system-ui"; ctx.fillText(item.details.join("   "),85,y+48);
    y+=175;
  });
  ctx.fillStyle="#8f98a5"; ctx.font="500 22px system-ui"; ctx.fillText("FitForge • General fitness information",70,1850);
  canvas.toBlob(async blob=>{
    if(!blob) return;
    const file=new File([blob],"fitforge-workout-story.png",{type:"image/png"});
    try{
      if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
        await navigator.share({title:"My FitForge Workout",files:[file]});
      }else{
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fitforge-workout-story.png"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      }
    }catch(e){
      if(e && e.name!=="AbortError"){
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fitforge-workout-story.png"; a.click();
      }
    }
  },"image/png");
}
</script>
